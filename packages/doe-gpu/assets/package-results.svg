<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">doe-gpu package lanes</title>
  <desc id="desc">Neutral doe-gpu package lane card with Metal and Vulkan coverage.</desc>
  <defs>
    <linearGradient id="spectrum" x1="32" y1="40" x2="948" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#5d8dff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="980" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f5"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <style>
      text { font-family: "Space Grotesk", "Azeret Mono", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #08090c; }
      .title { font-size: 34px; font-weight: 950; letter-spacing: -0.5px; }
      .sub { font-size: 15px; font-weight: 700; fill: #30323a; }
      .eyebrow { font-size: 12px; font-weight: 900; letter-spacing: 4px; fill: #30323a; }
      .runtime { font-size: 22px; font-weight: 900; }
      .chip { font-size: 12px; font-weight: 900; letter-spacing: 2.5px; }
    </style>
  </defs>
  <rect width="980" height="300" fill="#ffffff"/>
  <rect x="18" y="18" width="944" height="264" rx="24" fill="url(#wash)"/>
  <rect x="18" y="18" width="944" height="264" rx="24" fill="none" stroke="#08090c" stroke-width="2"/>

  <text x="46" y="62" class="eyebrow">DOE-GPU</text>
  <text x="46" y="104" class="title">Package backend lanes</text>
  <text x="48" y="132" class="sub">Node and Bun keep Metal and Vulkan as explicit paths.</text>

  <g transform="translate(46 170)">
    <rect x="0" y="0" width="410" height="70" rx="20" fill="#08090c"/>
    <text x="28" y="43" class="runtime" style="fill:#ffffff">Node.js</text>
    <rect x="196" y="18" width="92" height="34" rx="17" fill="#ffffff"/>
    <text x="242" y="40" text-anchor="middle" class="chip">METAL</text>
    <rect x="302" y="18" width="96" height="34" rx="17" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="350" y="40" text-anchor="middle" class="chip" style="fill:#ffffff">VULKAN</text>
  </g>

  <g transform="translate(516 170)">
    <rect x="0" y="0" width="410" height="70" rx="20" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="28" y="43" class="runtime">Bun</text>
    <rect x="196" y="18" width="92" height="34" rx="17" fill="#08090c"/>
    <text x="242" y="40" text-anchor="middle" class="chip" style="fill:#ffffff">METAL</text>
    <rect x="302" y="18" width="96" height="34" rx="17" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="350" y="40" text-anchor="middle" class="chip">VULKAN</text>
  </g>

  <path d="M622 66c48-76 116-76 164 0" fill="none" stroke="#08090c" stroke-width="9" stroke-linecap="round"/>
  <path d="M622 66c48-76 116-76 164 0" fill="none" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round"/>
</svg>
