name: wgsl-compiler

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wgsl-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wgsl-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install configured Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig_version="$(jq -r '.toolchains.zig.version' config/toolchains.json)"
          zig_url="https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz"
          curl -fL "$zig_url" -o /tmp/zig.tar.xz
          rm -rf /tmp/zig-install
          mkdir -p /tmp/zig-install
          tar -xf /tmp/zig.tar.xz -C /tmp/zig-install --strip-components=1
          echo "/tmp/zig-install" >> "$GITHUB_PATH"
      - name: Run WGSL compiler tests
        working-directory: runtime/zig
        run: |
          zig build test-wgsl
          zig build test-wgsl -Dlean-verified=true
