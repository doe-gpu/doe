name: fawn-release-gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-report-gates:
    runs-on:
      - self-hosted
      - linux
      - amd-vulkan
    env:
      CONFIG_PATH: bench/native-compare/compare.config.amd.vulkan.release.json
      DROPIN_ARTIFACT: runtime/zig/zig-out/lib/libwebgpu_doe.so
    steps:
      - uses: actions/checkout@v7
      - name: Build Doe drop-in artifact
        working-directory: runtime/zig
        run: |
          zig build dropin -Doptimize=ReleaseFast
          test -f zig-out/lib/libwebgpu_doe.so
      - name: Run canonical release pipeline
        run: |
          python3 bench/runners/run_release_pipeline.py --config "$CONFIG_PATH" --strict-amd-vulkan --trace-semantic-parity-mode auto --with-dropin-gate --dropin-artifact "$DROPIN_ARTIFACT" --with-claim-gate
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fawn-release-gates-report
          path: |
            bench/out/dawn-vs-doe.amd.vulkan.release*.json
            bench/out/**/dawn-vs-doe.amd.vulkan.release*.json
            bench/out/dawn-vs-doe.amd.vulkan.release*.html
            bench/out/**/dawn-vs-doe.amd.vulkan.release*.html
            bench/out/runtime-comparisons.amd.vulkan.release*
            bench/out/**/runtime-comparisons.amd.vulkan.release*
            bench/out/**/run_manifest.json
            bench/out/dropin_*.json
            bench/out/**/dropin_*.json
            bench/out/dropin_*.html
            bench/out/**/dropin_*.html
