<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1024 912" role="img" aria-labelledby="title desc">
  <title id="title">Doe logo</title>
  <desc id="desc">Doe source-preserving runtime mark with Metal and Vulkan lanes.</desc>
  <defs>
    <linearGradient id="spectrum" x1="112" y1="96" x2="900" y2="792" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#5d8dff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1024" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f5"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <style>
      text { font-family: "Space Grotesk", "Azeret Mono", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #08090c; }
      .word { font-size: 178px; font-weight: 950; letter-spacing: 16px; }
      .sub { font-size: 28px; font-weight: 850; letter-spacing: 6px; fill: #30323a; }
      .chip { font-size: 25px; font-weight: 900; letter-spacing: 5px; }
    </style>
  </defs>

  <rect width="1024" height="912" rx="96" fill="#ffffff"/>
  <rect x="52" y="52" width="920" height="808" rx="74" fill="url(#wash)"/>
  <rect x="52" y="52" width="920" height="808" rx="74" fill="none" stroke="#08090c" stroke-width="6"/>

  <g transform="translate(160 132)">
    <rect x="0" y="0" width="704" height="320" rx="64" fill="#08090c"/>
    <path d="M100 224c94-178 210-178 304 0" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <path d="M304 224c94-178 210-178 304 0" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <path d="M100 224c94-178 210-178 304 0M304 224c94-178 210-178 304 0" fill="none" stroke="url(#spectrum)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="100" cy="224" r="23" fill="#ff6b7a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="352" cy="46" r="23" fill="#5d8dff" stroke="#ffffff" stroke-width="5"/>
    <circle cx="608" cy="224" r="23" fill="#b98cff" stroke="#ffffff" stroke-width="5"/>
  </g>

  <text x="512" y="608" text-anchor="middle" class="word">DOE</text>
  <text x="512" y="666" text-anchor="middle" class="sub">VISIBLE LOWERING</text>

  <g transform="translate(316 716)">
    <rect x="0" y="0" width="160" height="54" rx="27" fill="#08090c"/>
    <text x="80" y="36" text-anchor="middle" class="chip" style="fill:#ffffff">METAL</text>
    <rect x="192" y="0" width="176" height="54" rx="27" fill="#ffffff" stroke="#08090c" stroke-width="5"/>
    <text x="280" y="36" text-anchor="middle" class="chip">VULKAN</text>
  </g>
</svg>
