<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="620" viewBox="0 0 1340 620" role="img" aria-labelledby="title desc">
  <title id="title">Doe backend lanes</title>
  <desc id="desc">Neutral Doe evidence card showing Metal and Vulkan lanes.</desc>
  <defs>
    <linearGradient id="spectrum" x1="48" y1="60" x2="1292" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#5d8dff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1340" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f5"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <style>
      text { font-family: "Space Grotesk", "Azeret Mono", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #08090c; }
      .title { font-size: 56px; font-weight: 950; letter-spacing: -1px; }
      .sub { font-size: 20px; font-weight: 700; fill: #30323a; }
      .eyebrow { font-size: 14px; font-weight: 900; letter-spacing: 5px; fill: #30323a; }
      .node { font-size: 28px; font-weight: 900; }
      .small { font-size: 17px; font-weight: 700; fill: #30323a; }
      .chip { font-size: 15px; font-weight: 900; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1340" height="620" fill="#ffffff"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="url(#wash)"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="none" stroke="#08090c" stroke-width="2"/>

  <text x="76" y="112" class="eyebrow">DOE</text>
  <text x="76" y="178" class="title">Backend evidence lanes</text>
  <text x="78" y="218" class="sub">Visible lowering for Metal and Vulkan. Receipts stay attached to the path.</text>

  <g transform="translate(76 286)">
    <rect x="0" y="0" width="360" height="198" rx="28" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="34" y="58" class="eyebrow">NATIVE</text>
    <text x="34" y="104" class="node">Source kept visible</text>
    <text x="34" y="142" class="small">WGSL input, explicit backend emit.</text>
    <path d="M34 166h220" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(490 286)">
    <rect x="0" y="0" width="360" height="198" rx="28" fill="#08090c"/>
    <text x="34" y="58" class="eyebrow" style="fill:#ffffff">COMPARE</text>
    <text x="34" y="104" class="node" style="fill:#ffffff">Same work boundary</text>
    <text x="34" y="142" class="small" style="fill:#f4f4f5">Timing scope is part of the artifact.</text>
    <path d="M34 166h220" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(904 286)">
    <rect x="0" y="0" width="360" height="198" rx="28" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="34" y="58" class="eyebrow">BACKENDS</text>
    <rect x="34" y="88" width="126" height="42" rx="21" fill="#08090c"/>
    <text x="97" y="115" text-anchor="middle" class="chip" style="fill:#ffffff">METAL</text>
    <rect x="178" y="88" width="142" height="42" rx="21" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="249" y="115" text-anchor="middle" class="chip">VULKAN</text>
    <text x="34" y="166" class="small">Separate lanes, shared contract.</text>
  </g>
</svg>
