<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="620" viewBox="0 0 1340 620" role="img" aria-labelledby="title desc">
  <title id="title">Doe package lanes</title>
  <desc id="desc">Doe package card showing Node and Bun lanes across Metal and Vulkan.</desc>
  <defs>
    <linearGradient id="spectrum" x1="72" y1="86" x2="1270" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#5d8dff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1340" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f5"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <style>
      text { font-family: "Space Grotesk", "Azeret Mono", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #08090c; }
      .title { font-size: 54px; font-weight: 950; letter-spacing: -1px; }
      .sub { font-size: 20px; font-weight: 700; fill: #30323a; }
      .eyebrow { font-size: 14px; font-weight: 900; letter-spacing: 5px; fill: #30323a; }
      .runtime { font-size: 34px; font-weight: 950; }
      .small { font-size: 17px; font-weight: 700; fill: #30323a; }
      .chip { font-size: 15px; font-weight: 900; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1340" height="620" fill="#ffffff"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="url(#wash)"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="none" stroke="#08090c" stroke-width="2"/>

  <text x="76" y="112" class="eyebrow">DOE-GPU</text>
  <text x="76" y="176" class="title">Package lanes</text>
  <text x="78" y="216" class="sub">Node and Bun use the same visible backend contract.</text>

  <g transform="translate(76 292)">
    <rect x="0" y="0" width="1188" height="86" rx="26" fill="#08090c"/>
    <text x="36" y="55" class="runtime" style="fill:#ffffff">Node.js</text>
    <text x="280" y="55" class="small" style="fill:#f4f4f5">package runtime</text>
    <rect x="744" y="22" width="126" height="42" rx="21" fill="#ffffff"/>
    <text x="807" y="49" text-anchor="middle" class="chip">METAL</text>
    <rect x="890" y="22" width="142" height="42" rx="21" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="961" y="49" text-anchor="middle" class="chip" style="fill:#ffffff">VULKAN</text>
    <path d="M1058 43h74" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(76 406)">
    <rect x="0" y="0" width="1188" height="86" rx="26" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="36" y="55" class="runtime">Bun</text>
    <text x="280" y="55" class="small">package runtime</text>
    <rect x="744" y="22" width="126" height="42" rx="21" fill="#08090c"/>
    <text x="807" y="49" text-anchor="middle" class="chip" style="fill:#ffffff">METAL</text>
    <rect x="890" y="22" width="142" height="42" rx="21" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="961" y="49" text-anchor="middle" class="chip">VULKAN</text>
    <path d="M1058 43h74" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
