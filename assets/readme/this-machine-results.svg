<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Doe benchmark receipt summary</title>
  <desc id="desc">Data table summarizing README-indexed Doe benchmark receipts by backend, surface, metric, and artifact.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d7dde8; stroke-width: 1; }
      .rule { stroke: #d7dde8; stroke-width: 1; }
      .title { fill: #17202f; font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #566176; font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { fill: #334155; font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
      .cell { fill: #17202f; font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #667085; font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ok { fill: #0f766e; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .miss { fill: #9a3412; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #394150; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="650"/>
  <rect class="panel" x="42" y="34" width="1116" height="582" rx="8"/>

  <text class="title" x="70" y="82">Doe benchmark receipt summary</text>
  <text class="sub" x="70" y="111">Primary metric is p50 wall time per operation in milliseconds. Lower is better.</text>

  <line class="rule" x1="70" y1="140" x2="1130" y2="140"/>
  <text class="head" x="70" y="168">Backend</text>
  <text class="head" x="215" y="168">Surface</text>
  <text class="head" x="405" y="168">Comparison</text>
  <text class="head" x="610" y="168">p50 metric</text>
  <text class="head" x="765" y="168">Result</text>
  <text class="head" x="875" y="168">Artifact</text>
  <line class="rule" x1="70" y1="184" x2="1130" y2="184"/>

  <text class="cell" x="70" y="214">Apple Metal</text>
  <text class="cell" x="215" y="214">Native strict</text>
  <text class="cell" x="405" y="214">Doe vs Dawn</text>
  <text class="cell" x="610" y="214">0.9 vs 1.6 ms</text>
  <text class="ok" x="765" y="214">Doe +47.5%</text>
  <text class="mono" x="875" y="214">bench/out/apple-metal/compare/...metal.compare.json</text>

  <line class="rule" x1="70" y1="236" x2="1130" y2="236"/>
  <text class="cell" x="70" y="260">Apple Metal</text>
  <text class="cell" x="215" y="260">Native release</text>
  <text class="cell" x="405" y="260">Doe vs Dawn</text>
  <text class="cell" x="610" y="260">2.5 vs 5.6 ms</text>
  <text class="ok" x="765" y="260">Doe +55.5%</text>
  <text class="mono" x="875" y="260">bench/out/apple-metal/release/...release.json</text>

  <line class="rule" x1="70" y1="282" x2="1130" y2="282"/>
  <text class="cell" x="70" y="306">Apple Metal</text>
  <text class="cell" x="215" y="306">Node package</text>
  <text class="cell" x="405" y="306">Doe vs node-webgpu</text>
  <text class="cell" x="610" y="306">108.9 vs 113.1 ms</text>
  <text class="ok" x="765" y="306">Doe +3.7%</text>
  <text class="mono" x="875" y="306">bench/out/apple-metal/...node-package...json</text>

  <line class="rule" x1="70" y1="328" x2="1130" y2="328"/>
  <text class="cell" x="70" y="352">Apple Metal</text>
  <text class="cell" x="215" y="352">Bun package</text>
  <text class="cell" x="405" y="352">Doe vs bun-webgpu</text>
  <text class="cell" x="610" y="352">107.9 vs 116.3 ms</text>
  <text class="ok" x="765" y="352">Doe +7.2%</text>
  <text class="mono" x="875" y="352">bench/out/apple-metal/...bun-package...json</text>

  <line class="rule" x1="70" y1="374" x2="1130" y2="374"/>
  <text class="cell" x="70" y="398">Apple Metal</text>
  <text class="cell" x="215" y="398">Node ORT</text>
  <text class="cell" x="405" y="398">Doe vs node-webgpu</text>
  <text class="cell" x="610" y="398">4976.8 vs 5124.5 ms</text>
  <text class="ok" x="765" y="398">Doe +2.9%</text>
  <text class="mono" x="875" y="398">bench/out/apple-metal-ort-node/...json</text>

  <line class="rule" x1="70" y1="420" x2="1130" y2="420"/>
  <text class="cell" x="70" y="444">Apple Metal</text>
  <text class="cell" x="215" y="444">Bun ORT</text>
  <text class="cell" x="405" y="444">Doe vs bun-webgpu</text>
  <text class="cell" x="610" y="444">1313.8 vs 1314.7 ms</text>
  <text class="ok" x="765" y="444">Doe +0.1%</text>
  <text class="mono" x="875" y="444">bench/out/apple-metal-ort-bun/...json</text>

  <line class="rule" x1="70" y1="466" x2="1130" y2="466"/>
  <text class="cell" x="70" y="490">Apple Metal</text>
  <text class="cell" x="215" y="490">Browser ORT</text>
  <text class="cell" x="405" y="490">Doe vs Dawn</text>
  <text class="cell" x="610" y="490">124.5 vs 130.2 ms</text>
  <text class="ok" x="765" y="490">Doe +4.4%</text>
  <text class="mono" x="875" y="490">bench/out/browser-ort-webgpu-compare/...json</text>

  <line class="rule" x1="70" y1="512" x2="1130" y2="512"/>
  <text class="cell" x="70" y="536">AMD Vulkan</text>
  <text class="cell" x="215" y="536">Support matrix</text>
  <text class="muted" x="405" y="536">No README-indexed receipt row</text>
  <text class="muted" x="610" y="536">Status only</text>
  <text class="miss" x="765" y="536">Not claimed</text>
  <text class="mono" x="875" y="536">docs/doe-support-matrix.md</text>
</svg>
