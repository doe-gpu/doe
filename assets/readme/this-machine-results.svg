<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="620" viewBox="0 0 1340 620" role="img" aria-labelledby="title desc">
  <title id="title">Doe machine evidence</title>
  <desc id="desc">Doe machine evidence card with Metal and Vulkan coverage.</desc>
  <defs>
    <linearGradient id="spectrum" x1="60" y1="80" x2="1280" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#5d8dff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1340" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f5"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <style>
      text { font-family: "Space Grotesk", "Azeret Mono", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #08090c; }
      .title { font-size: 54px; font-weight: 950; letter-spacing: -1px; }
      .sub { font-size: 20px; font-weight: 700; fill: #30323a; }
      .eyebrow { font-size: 14px; font-weight: 900; letter-spacing: 5px; fill: #30323a; }
      .lane { font-size: 32px; font-weight: 950; }
      .small { font-size: 17px; font-weight: 700; fill: #30323a; }
      .mono { font-family: "Azeret Mono", "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1340" height="620" fill="#ffffff"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="url(#wash)"/>
  <rect x="28" y="28" width="1284" height="564" rx="34" fill="none" stroke="#08090c" stroke-width="2"/>

  <text x="76" y="112" class="eyebrow">THIS MACHINE</text>
  <text x="76" y="176" class="title">Evidence, not theater</text>
  <text x="78" y="216" class="sub">The card names the lane and leaves the numbers to the artifact.</text>

  <g transform="translate(76 292)">
    <rect x="0" y="0" width="564" height="198" rx="28" fill="#08090c"/>
    <text x="36" y="58" class="eyebrow" style="fill:#ffffff">APPLE</text>
    <text x="36" y="110" class="lane" style="fill:#ffffff">Metal lane</text>
    <text x="36" y="150" class="small" style="fill:#f4f4f5">Native backend path, explicit receipts.</text>
    <path d="M338 132c42-86 102-86 144 0" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M338 132c42-86 102-86 144 0" fill="none" stroke="url(#spectrum)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(700 292)">
    <rect x="0" y="0" width="564" height="198" rx="28" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="36" y="58" class="eyebrow">AMD / LINUX</text>
    <text x="36" y="110" class="lane">Vulkan lane</text>
    <text x="36" y="150" class="small">Same contract, separate hardware path.</text>
    <rect x="350" y="58" width="142" height="42" rx="21" fill="#ffffff" stroke="#08090c" stroke-width="2"/>
    <text x="421" y="85" text-anchor="middle" class="mono">VULKAN</text>
  </g>
</svg>
